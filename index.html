<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Onchain POAPs Studio</title>
<meta name="description" content="Create, distribute and mint fully onchain POAPs. Zero-dependency frontend for the OnchainPOAPs ERC-1155 contract.">
<meta property="og:title" content="Onchain POAPs Studio">
<meta property="og:description" content="Create, distribute and mint fully onchain POAPs — registration, public/allowlist/signature minting, QR distribution, gallery.">
<meta property="og:image" content="./icon.png">
<link rel="icon" href="./icon.svg" type="image/svg+xml">
<style>
:root{
  --bg:#0b0e14; --bg2:#11151f; --bg3:#171c2a; --line:#232a3d; --line2:#2e3752;
  --tx:#e8ecf6; --tx2:#98a2bd; --tx3:#5f6a85;
  --ac:#7c5cff; --ac2:#9d85ff; --ok:#3ddc97; --warn:#ffb454; --err:#ff6b7a;
  --rad:14px; --mono:ui-monospace,'Cascadia Mono','JetBrains Mono',Consolas,monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--tx);font:15px/1.55 system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;-webkit-font-smoothing:antialiased}
a{color:var(--ac2);text-decoration:none} a:hover{text-decoration:underline}
button{font:inherit;cursor:pointer;border:0;border-radius:10px;padding:10px 18px;background:var(--ac);color:#fff;font-weight:600;transition:.15s}
button:hover{background:var(--ac2)} button:disabled{opacity:.45;cursor:not-allowed}
button.ghost{background:var(--bg3);color:var(--tx);border:1px solid var(--line2)} button.ghost:hover{border-color:var(--ac)}
button.small{padding:6px 12px;font-size:13px;border-radius:8px}
button.danger{background:var(--err)}
input,textarea,select{font:inherit;background:var(--bg2);border:1px solid var(--line2);color:var(--tx);border-radius:10px;padding:10px 12px;width:100%}
input:focus,textarea:focus,select:focus{outline:none;border-color:var(--ac)}
textarea{resize:vertical;min-height:90px}
label{display:block;font-size:13px;color:var(--tx2);margin:14px 0 6px;font-weight:600;letter-spacing:.02em}
label .opt{color:var(--tx3);font-weight:400}
.hint{font-size:12px;color:var(--tx3);margin-top:4px}
.wrap{max-width:1080px;margin:0 auto;padding:0 20px}
header{position:sticky;top:0;z-index:50;background:rgba(11,14,20,.85);backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.nav{display:flex;align-items:center;gap:6px;padding:10px 0;flex-wrap:wrap}
.logo{display:flex;align-items:center;gap:10px;font-weight:800;font-size:17px;margin-right:14px;color:var(--tx)}
.logo .dot{width:26px;height:26px;border-radius:8px;background:linear-gradient(135deg,var(--ac),#4f9cff);display:grid;place-items:center;font-size:14px}
.nav a.tab{padding:8px 13px;border-radius:9px;color:var(--tx2);font-weight:600;font-size:14px}
.nav a.tab:hover{color:var(--tx);background:var(--bg3);text-decoration:none}
.nav a.tab.on{color:#fff;background:var(--bg3)}
.nav .sp{flex:1}
#netpill{font-family:var(--mono);font-size:12px;padding:6px 10px;border-radius:99px;border:1px solid var(--line2);color:var(--tx2);background:var(--bg2);cursor:pointer}
#netpill.bad{border-color:var(--warn);color:var(--warn)}
#addrbtn{font-family:var(--mono);font-size:12.5px}
main{padding:26px 0 80px}
h1{font-size:30px;font-weight:800;letter-spacing:-.02em;margin-bottom:6px}
h2{font-size:21px;font-weight:700;margin:30px 0 10px;letter-spacing:-.01em}
h3{font-size:16px;font-weight:700;margin:18px 0 8px}
.sub{color:var(--tx2);max-width:640px}
.card{background:var(--bg2);border:1px solid var(--line);border-radius:var(--rad);padding:22px}
.card+.card{margin-top:16px}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:1fr 1fr} .g3{grid-template-columns:repeat(3,1fr)}
@media(max-width:760px){.g2,.g3{grid-template-columns:1fr}}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;padding:4px 10px;border-radius:99px;border:1px solid var(--line2);color:var(--tx2)}
.pill.ok{color:var(--ok);border-color:rgba(61,220,151,.4)} .pill.warn{color:var(--warn);border-color:rgba(255,180,84,.4)}
.pill.err{color:var(--err);border-color:rgba(255,107,122,.4)} .pill.ac{color:var(--ac2);border-color:rgba(124,92,255,.45)}
.mono{font-family:var(--mono);font-size:12.5px;word-break:break-all}
.kv{display:grid;grid-template-columns:150px 1fr;gap:6px 14px;font-size:14px}
.kv dt{color:var(--tx3)} .kv dd{color:var(--tx);word-break:break-word}
.count{font-family:var(--mono);color:var(--tx2);font-size:12px;margin-top:4px}
.banner{border:1px solid var(--line2);background:var(--bg3);border-radius:12px;padding:12px 16px;font-size:13.5px;color:var(--tx2);margin:14px 0}
.banner.err{border-color:rgba(255,107,122,.5);color:var(--err)}
.banner.ok{border-color:rgba(61,220,151,.5);color:var(--ok)}
.banner.warn{border-color:rgba(255,180,84,.5);color:var(--warn)}
.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--bg3);border:1px solid var(--line2);color:var(--tx);padding:11px 18px;border-radius:12px;font-size:13.5px;z-index:99;max-width:90vw;box-shadow:0 8px 30px rgba(0,0,0,.5)}
.toast a{margin-left:8px}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px}
.poap{background:var(--bg2);border:1px solid var(--line);border-radius:var(--rad);overflow:hidden;cursor:pointer;transition:.15s;position:relative}
.poap:hover{border-color:var(--ac);transform:translateY(-2px)}
.poap .art{aspect-ratio:1;background:#fff;display:grid;place-items:center}
.poap .art img{width:100%;height:100%;object-fit:contain}
.poap .meta{padding:12px 14px}
.poap .meta .nm{font-weight:700;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.poap .meta .dt{font-size:12px;color:var(--tx3);margin-top:2px}
.poap .own{position:absolute;top:10px;right:10px;background:rgba(61,220,151,.15);border:1px solid rgba(61,220,151,.5);color:var(--ok);font-size:11px;font-weight:700;border-radius:99px;padding:2px 9px;backdrop-filter:blur(4px)}
.poap .sk{aspect-ratio:1;background:linear-gradient(100deg,var(--bg3) 40%,var(--bg2) 50%,var(--bg3) 60%);background-size:200% 100%;animation:sh 1.2s infinite}
@keyframes sh{to{background-position:-200% 0}}
.modal{position:fixed;inset:0;background:rgba(5,7,12,.75);backdrop-filter:blur(6px);z-index:80;display:grid;place-items:center;padding:20px}
.modal .box{background:var(--bg2);border:1px solid var(--line2);border-radius:16px;max-width:560px;width:100%;max-height:88vh;overflow:auto;padding:24px}
.modal .artbig{background:#fff;border-radius:12px;overflow:hidden;display:grid;place-items:center;margin:12px 0}
.modal .artbig img{width:100%;max-height:320px;object-fit:contain}
pre.code{background:var(--bg3);border:1px solid var(--line);border-radius:10px;padding:12px 14px;font-family:var(--mono);font-size:12px;overflow:auto;color:#c8d3ee;line-height:1.6}
table.tbl{width:100%;border-collapse:collapse;font-size:13.5px}
table.tbl th{color:var(--tx3);text-align:left;font-weight:600;padding:8px 10px;border-bottom:1px solid var(--line2)}
table.tbl td{padding:8px 10px;border-bottom:1px solid var(--line);font-family:var(--mono);font-size:12.5px;word-break:break-all}
.check{display:flex;align-items:flex-start;gap:10px;padding:10px 12px;border:1px solid var(--line2);border-radius:10px;cursor:pointer;margin-top:8px}
.check input{width:16px;height:16px;margin-top:2px;accent-color:var(--ac)}
.check .t b{display:block;font-size:14px} .check .t span{font-size:12.5px;color:var(--tx2)}
.steps{counter-reset:s;margin:10px 0}
.steps li{list-style:none;counter-increment:s;position:relative;padding:8px 0 8px 42px;color:var(--tx2);font-size:14px}
.steps li:before{content:counter(s);position:absolute;left:0;top:7px;width:26px;height:26px;border-radius:99px;background:var(--bg3);border:1px solid var(--line2);display:grid;place-items:center;font-family:var(--mono);font-size:12px;color:var(--ac2)}
.qrsheet{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:14px}
.qrcard{background:#fff;border-radius:12px;padding:14px;text-align:center;color:#111}
.qrcard img{width:100%;image-rendering:pixelated}
.qrcard .cap{font-size:11px;font-family:var(--mono);margin-top:8px;word-break:break-all;color:#333}
footer{border-top:1px solid var(--line);padding:26px 0;color:var(--tx3);font-size:13px}
.sep{border:0;border-top:1px solid var(--line);margin:22px 0}
.stat{display:flex;gap:26px;flex-wrap:wrap;margin:16px 0}
.stat .b b{font-size:24px;display:block;letter-spacing:-.02em} .stat .b span{font-size:12px;color:var(--tx3)}
#heroart{position:fixed;right:-120px;top:-120px;width:420px;height:420px;opacity:.13;pointer-events:none;filter:blur(2px)}
@media print{ header,footer,.noprint{display:none} body{background:#fff;color:#000} }
</style>

<header><div class="wrap nav">

<script>
//---------------------------------------------------------------------
//
// QR Code Generator for JavaScript
//
// Copyright (c) 2009 Kazuhiko Arase
//
// URL: http://www.d-project.com/
//
// Licensed under the MIT license:
//  http://www.opensource.org/licenses/mit-license.php
//
// The word 'QR Code' is registered trademark of
// DENSO WAVE INCORPORATED
//  http://www.denso-wave.com/qrcode/faqpatent-e.html
//
//---------------------------------------------------------------------

var qrcode = function() {

  //---------------------------------------------------------------------
  // qrcode
  //---------------------------------------------------------------------

  /**
   * qrcode
   * @param typeNumber 1 to 40
   * @param errorCorrectionLevel 'L','M','Q','H'
   */
  var qrcode = function(typeNumber, errorCorrectionLevel) {

    var PAD0 = 0xEC;
    var PAD1 = 0x11;

    var _typeNumber = typeNumber;
    var _errorCorrectionLevel = QRErrorCorrectionLevel[errorCorrectionLevel];
    var _modules = null;
    var _moduleCount = 0;
    var _dataCache = null;
    var _dataList = [];

    var _this = {};

    var makeImpl = function(test, maskPattern) {

      _moduleCount = _typeNumber * 4 + 17;
      _modules = function(moduleCount) {
        var modules = new Array(moduleCount);
        for (var row = 0; row < moduleCount; row += 1) {
          modules[row] = new Array(moduleCount);
          for (var col = 0; col < moduleCount; col += 1) {
            modules[row][col] = null;
          }
        }
        return modules;
      }(_moduleCount);

      setupPositionProbePattern(0, 0);
      setupPositionProbePattern(_moduleCount - 7, 0);
      setupPositionProbePattern(0, _moduleCount - 7);
      setupPositionAdjustPattern();
      setupTimingPattern();
      setupTypeInfo(test, maskPattern);

      if (_typeNumber >= 7) {
        setupTypeNumber(test);
      }

      if (_dataCache == null) {
        _dataCache = createData(_typeNumber, _errorCorrectionLevel, _dataList);
      }

      mapData(_dataCache, maskPattern);
    };

    var setupPositionProbePattern = function(row, col) {

      for (var r = -1; r <= 7; r += 1) {

        if (row + r <= -1 || _moduleCount <= row + r) continue;

        for (var c = -1; c <= 7; c += 1) {

          if (col + c <= -1 || _moduleCount <= col + c) continue;

          if ( (0 <= r && r <= 6 && (c == 0 || c == 6) )
              || (0 <= c && c <= 6 && (r == 0 || r == 6) )
              || (2 <= r && r <= 4 && 2 <= c && c <= 4) ) {
            _modules[row + r][col + c] = true;
          } else {
            _modules[row + r][col + c] = false;
          }
        }
      }
    };

    var getBestMaskPattern = function() {

      var minLostPoint = 0;
      var pattern = 0;

      for (var i = 0; i < 8; i += 1) {

        makeImpl(true, i);

        var lostPoint = QRUtil.getLostPoint(_this);

        if (i == 0 || minLostPoint > lostPoint) {
          minLostPoint = lostPoint;
          pattern = i;
        }
      }

      return pattern;
    };

    var setupTimingPattern = function() {

      for (var r = 8; r < _moduleCount - 8; r += 1) {
        if (_modules[r][6] != null) {
          continue;
        }
        _modules[r][6] = (r % 2 == 0);
      }

      for (var c = 8; c < _moduleCount - 8; c += 1) {
        if (_modules[6][c] != null) {
          continue;
        }
        _modules[6][c] = (c % 2 == 0);
      }
    };

    var setupPositionAdjustPattern = function() {

      var pos = QRUtil.getPatternPosition(_typeNumber);

      for (var i = 0; i < pos.length; i += 1) {

        for (var j = 0; j < pos.length; j += 1) {

          var row = pos[i];
          var col = pos[j];

          if (_modules[row][col] != null) {
            continue;
          }

          for (var r = -2; r <= 2; r += 1) {

            for (var c = -2; c <= 2; c += 1) {

              if (r == -2 || r == 2 || c == -2 || c == 2
                  || (r == 0 && c == 0) ) {
                _modules[row + r][col + c] = true;
              } else {
                _modules[row + r][col + c] = false;
              }
            }
          }
        }
      }
    };

    var setupTypeNumber = function(test) {

      var bits = QRUtil.getBCHTypeNumber(_typeNumber);

      for (var i = 0; i < 18; i += 1) {
        var mod = (!test && ( (bits >> i) & 1) == 1);
        _modules[Math.floor(i / 3)][i % 3 + _moduleCount - 8 - 3] = mod;
      }

      for (var i = 0; i < 18; i += 1) {
        var mod = (!test && ( (bits >> i) & 1) == 1);
        _modules[i % 3 + _moduleCount - 8 - 3][Math.floor(i / 3)] = mod;
      }
    };

    var setupTypeInfo = function(test, maskPattern) {

      var data = (_errorCorrectionLevel << 3) | maskPattern;
      var bits = QRUtil.getBCHTypeInfo(data);

      // vertical
      for (var i = 0; i < 15; i += 1) {

        var mod = (!test && ( (bits >> i) & 1) == 1);

        if (i < 6) {
          _modules[i][8] = mod;
        } else if (i < 8) {
          _modules[i + 1][8] = mod;
        } else {
          _modules[_moduleCount - 15 + i][8] = mod;
        }
      }

      // horizontal
      for (var i = 0; i < 15; i += 1) {

        var mod = (!test && ( (bits >> i) & 1) == 1);

        if (i < 8) {
          _modules[8][_moduleCount - i - 1] = mod;
        } else if (i < 9) {
          _modules[8][15 - i - 1 + 1] = mod;
        } else {
          _modules[8][15 - i - 1] = mod;
        }
      }

      // fixed module
      _modules[_moduleCount - 8][8] = (!test);
    };

    var mapData = function(data, maskPattern) {

      var inc = -1;
      var row = _moduleCount - 1;
      var bitIndex = 7;
      var byteIndex = 0;
      var maskFunc = QRUtil.getMaskFunction(maskPattern);

      for (var col = _moduleCount - 1; col > 0; col -= 2) {

        if (col == 6) col -= 1;

        while (true) {

          for (var c = 0; c < 2; c += 1) {

            if (_modules[row][col - c] == null) {

              var dark = false;

              if (byteIndex < data.length) {
                dark = ( ( (data[byteIndex] >>> bitIndex) & 1) == 1);
              }

              var mask = maskFunc(row, col - c);

              if (mask) {
                dark = !dark;
              }

              _modules[row][col - c] = dark;
              bitIndex -= 1;

              if (bitIndex == -1) {
                byteIndex += 1;
                bitIndex = 7;
              }
            }
          }

          row += inc;

          if (row < 0 || _moduleCount <= row) {
            row -= inc;
            inc = -inc;
            break;
          }
        }
      }
    };

    var createBytes = function(buffer, rsBlocks) {

      var offset = 0;

      var maxDcCount = 0;
      var maxEcCount = 0;

      var dcdata = new Array(rsBlocks.length);
      var ecdata = new Array(rsBlocks.length);

      for (var r = 0; r < rsBlocks.length; r += 1) {

        var dcCount = rsBlocks[r].dataCount;
        var ecCount = rsBlocks[r].totalCount - dcCount;

        maxDcCount = Math.max(maxDcCount, dcCount);
        maxEcCount = Math.max(maxEcCount, ecCount);

        dcdata[r] = new Array(dcCount);

        for (var i = 0; i < dcdata[r].length; i += 1) {
          dcdata[r][i] = 0xff & buffer.getBuffer()[i + offset];
        }
        offset += dcCount;

        var rsPoly = QRUtil.getErrorCorrectPolynomial(ecCount);
        var rawPoly = qrPolynomial(dcdata[r], rsPoly.getLength() - 1);

        var modPoly = rawPoly.mod(rsPoly);
        ecdata[r] = new Array(rsPoly.getLength() - 1);
        for (var i = 0; i < ecdata[r].length; i += 1) {
          var modIndex = i + modPoly.getLength() - ecdata[r].length;
          ecdata[r][i] = (modIndex >= 0)? modPoly.getAt(modIndex) : 0;
        }
      }

      var totalCodeCount = 0;
      for (var i = 0; i < rsBlocks.length; i += 1) {
        totalCodeCount += rsBlocks[i].totalCount;
      }

      var data = new Array(totalCodeCount);
      var index = 0;

      for (var i = 0; i < maxDcCount; i += 1) {
        for (var r = 0; r < rsBlocks.length; r += 1) {
          if (i < dcdata[r].length) {
            data[index] = dcdata[r][i];
            index += 1;
          }
        }
      }

      for (var i = 0; i < maxEcCount; i += 1) {
        for (var r = 0; r < rsBlocks.length; r += 1) {
          if (i < ecdata[r].length) {
            data[index] = ecdata[r][i];
            index += 1;
          }
        }
      }

      return data;
    };

    var createData = function(typeNumber, errorCorrectionLevel, dataList) {

      var rsBlocks = QRRSBlock.getRSBlocks(typeNumber, errorCorrectionLevel);

      var buffer = qrBitBuffer();

      for (var i = 0; i < dataList.length; i += 1) {
        var data = dataList[i];
        buffer.put(data.getMode(), 4);
        buffer.put(data.getLength(), QRUtil.getLengthInBits(data.getMode(), typeNumber) );
        data.write(buffer);
      }

      // calc num max data.
      var totalDataCount = 0;
      for (var i = 0; i < rsBlocks.length; i += 1) {
        totalDataCount += rsBlocks[i].dataCount;
      }

      if (buffer.getLengthInBits() > totalDataCount * 8) {
        throw 'code length overflow. ('
          + buffer.getLengthInBits()
          + '>'
          + totalDataCount * 8
          + ')';
      }

      // end code
      if (buffer.getLengthInBits() + 4 <= totalDataCount * 8) {
        buffer.put(0, 4);
      }

      // padding
      while (buffer.getLengthInBits() % 8 != 0) {
        buffer.putBit(false);
      }

      // padding
      while (true) {

        if (buffer.getLengthInBits() >= totalDataCount * 8) {
          break;
        }
        buffer.put(PAD0, 8);

        if (buffer.getLengthInBits() >= totalDataCount * 8) {
          break;
        }
        buffer.put(PAD1, 8);
      }

      return createBytes(buffer, rsBlocks);
    };

    _this.addData = function(data, mode) {

      mode = mode || 'Byte';

      var newData = null;

      switch(mode) {
      case 'Numeric' :
        newData = qrNumber(data);
        break;
      case 'Alphanumeric' :
        newData = qrAlphaNum(data);
        break;
      case 'Byte' :
        newData = qr8BitByte(data);
        break;
      case 'Kanji' :
        newData = qrKanji(data);
        break;
      default :
        throw 'mode:' + mode;
      }

      _dataList.push(newData);
      _dataCache = null;
    };

    _this.isDark = function(row, col) {
      if (row < 0 || _moduleCount <= row || col < 0 || _moduleCount <= col) {
        throw row + ',' + col;
      }
      return _modules[row][col];
    };

    _this.getModuleCount = function() {
      return _moduleCount;
    };

    _this.make = function() {
      if (_typeNumber < 1) {
        var typeNumber = 1;

        for (; typeNumber < 40; typeNumber++) {
          var rsBlocks = QRRSBlock.getRSBlocks(typeNumber, _errorCorrectionLevel);
          var buffer = qrBitBuffer();

          for (var i = 0; i < _dataList.length; i++) {
            var data = _dataList[i];
            buffer.put(data.getMode(), 4);
            buffer.put(data.getLength(), QRUtil.getLengthInBits(data.getMode(), typeNumber) );
            data.write(buffer);
          }

          var totalDataCount = 0;
          for (var i = 0; i < rsBlocks.length; i++) {
            totalDataCount += rsBlocks[i].dataCount;
          }

          if (buffer.getLengthInBits() <= totalDataCount * 8) {
            break;
          }
        }

        _typeNumber = typeNumber;
      }

      makeImpl(false, getBestMaskPattern() );
    };

    _this.createTableTag = function(cellSize, margin) {

      cellSize = cellSize || 2;
      margin = (typeof margin == 'undefined')? cellSize * 4 : margin;

      var qrHtml = '';

      qrHtml += '<table style="';
      qrHtml += ' border-width: 0px; border-style: none;';
      qrHtml += ' border-collapse: collapse;';
      qrHtml += ' padding: 0px; margin: ' + margin + 'px;';

          // UTF-16 encodes 0x10000-0x10FFFF by
          // subtracting 0x10000 and splitting the
          // 20 bits of 0x0-0xFFFFF into two halves
          charcode = 0x10000 + (((charcode & 0x3ff)<<10)
            | (str.charCodeAt(i) & 0x3ff));
          utf8.push(0xf0 | (charcode >>18),
              0x80 | ((charcode>>12) & 0x3f),
              0x80 | ((charcode>>6) & 0x3f),
              0x80 | (charcode & 0x3f));
        }
      }
      return utf8;
    }
    return toUTF8Array(s);
  };

function keccakF(st){for(let r=0;r<24;r++){const c=[];for(let x=0;x<5;x++)c[x]=st[x][0]^st[x][1]^st[x][2]^st[x][3]^st[x][4];for(let x=0;x<5;x++){const d=c[(x+4)%5]^rotl64(c[(x+1)%5],1);for(let y=0;y<5;y++)st[x][y]^=d;}const b=Array.from({length:5},()=>new Array(5).fill(0n));for(let x=0;x<5;x++)for(let y=0;y<5;y++)b[y][(2*x+3*y)%5]=rotl64(st[x][y],KECCAK_ROT[x][y]);for(let x=0;x<5;x++)for(let y=0;y<5;y++)st[x][y]=b[x][y]^((~b[(x+1)%5][y]&M64)&b[(x+2)%5][y]);st[0][0]^=KECCAK_RC[r];}}
function keccak256(bytes){const rate=136;const st=Array.from({length:5},()=>new Array(5).fill(0n));const padded=new Uint8Array(Math.ceil((bytes.length+1)/rate)*rate);padded.set(bytes);padded[bytes.length]=0x01;padded[padded.length-1]|=0x80;for(let off=0;off<padded.length;off+=rate){for(let i=0;i<rate/8;i++){let lane=0n;for(let j=0;j<8;j++)lane|=BigInt(padded[off+i*8+j])<<(8n*BigInt(j));st[i%5][Math.floor(i/5)]^=lane;}keccakF(st);}const out=new Uint8Array(32);for(let i=0;i<4;i++){const lane=st[i%5][Math.floor(i/5)];for(let j=0;j<8;j++)out[i*8+j]=Number((lane>>(8n*BigInt(j)))&0xffn);}return out;}
const hexOf=b=>[...b].map(x=>x.toString(16).padStart(2,'0')).join('');
const utf8=s=>new TextEncoder().encode(s);
const fromHex=h=>{h=h.replace(/^0x/,'');const o=new Uint8Array(h.length/2);for(let i=0;i<o.length;i++)o[i]=parseInt(h.substr(i*2,2),16);return o;};

/* ---- ABI ---- */
const u256=n=>{let v=BigInt(n).toString(16);if(v.length>64)throw Error('uint overflow');return v.padStart(64,'0')};

const sel=sig=>hexOf(keccak256(utf8(sig))).slice(0,8);
function encodeRegisterEvent(name,desc,date,loc,root,svg,url,flags){
  const bl=[encStr(name),encStr(desc),encStr(loc),encStr(svg),encStr(url)];
  let o=8*32;const offs=bl.map(b=>{const r=o;o+=b.length/2;return u256(r)});
  return '0x'+sel('registerEvent(string,string,uint256,string,bytes32,string,string,uint8)')

}
const encodeMint=id=>'0x'+sel('mint(uint256)')+u256(id);
const encodeAllowlistMint=(id,proof)=>'0x'+sel('allowlistMint(uint256,bytes32[])')+u256(id)+u256(64)+u256(proof.length)+proof.map(p=>p.replace(/^0x/,'').padStart(64,'0')).join('');
const encodeMintWithSignature=(id,sig)=>{const s=sig.replace(/^0x/,'');const full=Math.ceil(s.length/2/32)*32;return '0x'+sel('mintWithSignature(uint256,bytes)')+u256(id)+u256(64)+u256(s.length/2)+s.padEnd(full*2,'0')};
const encodeUpdateRoot=(id,root)=>'0x'+sel('updateAllowlistRoot(uint256,bytes32)')+u256(id)+root.replace(/^0x/,'').padStart(64,'0');
const encodeUpdatePublic=(id,pub)=>'0x'+sel('updateEventPublic(uint256,bool)')+u256(id)+u256(pub?1:0);
const encodeCreatorMint=(id,addrs)=>'0x'+sel('creatorMint(uint256,address[])')+u256(id)+u256(64)+u256(addrs.length)+addrs.map(a=>a.replace(/^0x/,'').toLowerCase().padStart(64,'0')).join('');
const SEL_TOTAL=sel('totalEvents()'), SEL_EVENT=sel('events(uint256)'), SEL_URI=sel('uri(uint256)'),
      SEL_BAL=sel('balanceOf(address,uint256)'), SEL_CLAIMED=sel('hasClaimed(uint256,address)'), SEL_MULTI=sel('getMultichainEventId(uint256)');

/* ---- ABI decode: Event struct + string ---- */
function decStr(data,startWordOffset){
  const off=parseInt(data.substr(startWordOffset*64,64),16)*2;
  const len=parseInt(data.substr(off,64),16)*2;
  const bytes=new Uint8Array(len/2);
  for(let i=0;i<bytes.length;i++)bytes[i]=parseInt(data.substr(off+64+i*2,2),16);
  return new TextDecoder().decode(bytes);
}
function decEvent(data){
  data=data.replace(/^0x/,'');
  const word=i=>data.substr(i*64,64);
  const name=decStr(data,0), desc=decStr(data,1);
  const date=BigInt('0x'+word(2));
  const loc=decStr(data,3);
  const root='0x'+word(4);
  const svg='0x'+word(5).slice(24);
  const creator='0x'+word(6).slice(24);
  const created=BigInt('0x'+word(7));
  const url=decStr(data,8);
  const sb=BigInt('0x'+word(9))===1n, pub=BigInt('0x'+word(10))===1n;
  return {name,description:desc,eventDate:date,location:loc,allowlistRoot:root,svgImage:svg,creator,createdAt:created,externalUrl:url,isSoulbound:sb,isPublic:pub};
}
function decUint(data){return BigInt('0x'+data.replace(/^0x/,'').slice(0,64))}

/* ---- Merkle (OZ sorted-pair, leaves = keccak256(packed(address))) ---- */
function addrBytes20(a){const x=a.toLowerCase().replace(/^0x/,'');const o=new Uint8Array(20);for(let i=0;i<20;i++)o[i]=parseInt(x.substr(i*2,2),16);return o}
const leafOf=a=>hexOf(keccak256(addrBytes20(a)));
function buildTree(addresses){
  let lvl=addresses.map(leafOf);const levels=[lvl.slice()];
  if(!lvl.length)return{root:'',levels:[[]]};
  while(lvl.length>1){const nx=[];for(let i=0;i<lvl.length;i+=2){const a=lvl[i],b=(lvl[i+1]!==undefined?lvl[i+1]:lvl[i]);nx.push(hexOf(keccak256(new Uint8Array([...fromHex(a<=b?a:b),...fromHex(a<=b?b:a)]))))}lvl=nx;levels.push(lvl.slice())}
  return{root:lvl[0],levels};
}
function getProof(tree,addr){
  const t=leafOf(addr);let idx=tree.levels[0].indexOf(t);if(idx<0)return null;const proof=[];
  for(let l=0;l<tree.levels.length-1;l++){const lv=tree.levels[l];const si=idx^1;proof.push(lv[si!==undefined&&si<lv.length?si:idx]);idx>>=1}
  return proof;
}
function checkProof(leaf,proof,root){let h=leaf;for(const p of proof){h=hexOf(keccak256(new Uint8Array([...fromHex(h<=p?h:p),...fromHex(h<=p?p:h)])))}return h===root}

/* ---- SVG minifier (lightweight SVGO-style cleanup) ---- */
function minifySvg(src){
  let s=src;
  s=s.replace(/<!--[\s\S]*?-->/g,'');
  s=s.replace(/<\?xml[\s\S]*?\?>/gi,'');
  s=s.replace(/<!DOCTYPE[\s\S]*?>/gi,'');
  s=s.replace(/\s(inkscape|sodipodi|xmlns:inkscape|xmlns:sodipodi|sketch|xmlns:sketch)(:[\w-]+)?="[^"]*"/g,'');
  s=s.replace(/<(metadata|sodipodi:namedview|inkscape:page)[\s\S]*?(<\/\1>|\/>)/g,'');
  s=s.replace(/id="[^"]*"/g,'').replace(/data-name="[^"]*"/g,'');
  s=s.replace(/\sclass="[^"]*"/g,'');
  s=s.replace(/\s([a-zA-Z-]+)=""/g,' ');
  s=s.replace(/(\d+\.\d{3})\d+/g,'$1');
  s=s.replace(/(\d+)\.0+(?=[^\d.]|$)/g,'$1');
  s=s.replace(/\s{2,}/g,' ').replace(/>\s+</g,'><').replace(/\s+>/g,'>').replace(/=\s+"/g,'="').trim();
  if(!s.startsWith('<svg'))throw new Error('Not an SVG document');

}

    }catch(e){$('#c_size').textContent='⚠ '+e.message;$('#c_prev').removeAttribute('src')}

    }catch(e){out.innerHTML='<div class="banner err">'+esc(e.message||String(e))+'</div>'}
  };
  upd();
}
function parseAddrs(t){return (t||'').split(/[\s,;]+/).map(x=>x.trim()).filter(x=>/^0x[0-9a-fA-F]{40}$/.test(x))}

async function viewGallery(q){

  if(!total){V.innerHTML='<h1>Gallery</h1><div class="banner">No POAPs registered yet. <a href="#/create">Create the first one →</a></div>';return}
  const cards=$('#g_cards');

  if(mineOnly&&!state.account){V.innerHTML='<div class="banner">Connect your wallet to filter your collection — or <a href="#/gallery">browse everything</a>.</div>';return}

        sigs.push({address:addrs[i],message:'0x'+msg,signature});
      }catch(e){$('#mg_sout').innerHTML='<div class="banner err">Signature '+i+' rejected: '+esc(e.message)+'</div>';return}
    }
    window._poapSigs={id,chainId:Number(chainId),sigs};
    $('#mg_sout').innerHTML='<div class="banner ok">✓ Signed '+sigs.length+' mint authorizations.</div>';
    $('#mg_sdl').disabled=false;$('#mg_qr').disabled=false;
  };
  const linkFor=s=>'https://'+location.host+location.pathname+'#/event/'+id+'?sig='+encodeURIComponent(s.signature);
  $('#mg_sdl').onclick=()=>{if(sigs)download('poap-'+id+'-signed-links.json',JSON.stringify({event:id,contract:state.contract,chainId:window._poapSigs.chainId,links:sigs.map(s=>({address:s.address,signature:s.signature,url:linkFor(s)}))},null,2))};
  $('#mg_qr').onclick=()=>{
    if(!sigs)return;
    const host=$('#mg_qrs');host.innerHTML='<h3>QR sheet <span class="pill">print me</span></h3><div class="qrsheet" id="qs"></div>';
    const qs=$('#qs');
    for(const s of sigs){
      const url=linkFor(s);
      const qr=qrcode(0,'M');qr.addData(url);qr.make();
      const d=document.createElement('div');d.className='qrcard';
      d.innerHTML='<img src="'+qr.createDataURL(4,8)+'" alt="qr"><div class="cap">'+esc(short(s.address))+'<br>#'+id+'</div>';
      qs.appendChild(d);
    }
    host.insertAdjacentHTML('beforeend','<div class="row noprint" style="margin-top:12px"><button class="ghost" onclick="window.print()">Print / save PDF</button></div>');
    host.scrollIntoView({behavior:'smooth'});
  };
}
function renderTreeAscii(tree){
  const levels=tree.levels;
  const lines=['root  0x'+levels[levels.length-1][0]];
  for(let l=levels.length-2;l>=0;l--){
    lines.push('');
    lines.push('level '+l+' ('+levels[l].length+' nodes)');
    for(const h of levels[l])lines.push('  0x'+h);
  }
  return lines.join('\n');
}

/* ---------- docs ---------- */
function viewDocs(){
  V.innerHTML=`
  <h1>Documentation</h1>
  <p class="sub">Everything an organizer or a minter needs to use Onchain POAPs without asking anyone.</p>
  <div class="card">
    <h2 style="margin-top:0">How the protocol works</h2>
    <p>Onchain POAPs is an <b>ERC-1155</b> contract where <b>event ID == token ID</b>. Registering a POAP stores its metadata fully onchain: the SVG artwork is base64-encoded and saved via SSTORE2 (artwork stored as contract bytecode — no IPFS, no server). The metadata <span class="mono">uri(tokenId)</span> is itself a base64 JSON data-URI containing the name, description, attributes and the image data-URI. Multichain event identity follows CAIP-2: <span class="mono">eip155:{chainId}:{contract}:{eventId}</span>.</p>
    <table class="tbl" style="margin-top:12px">
      <tr><th>Function</th><th>Who</th><th>Window</th><th>Notes</th></tr>
      <tr><td>registerEvent(...)</td><td>anyone</td><td>any time</td><td>name+SVG required; flags choose soulbound/public</td></tr>
      <tr><td>mint(eventId)</td><td>anyone</td><td>while public</td><td>one per address</td></tr>
      <tr><td>allowlistMint(eventId, proof)</td><td>listed addresses</td><td>any time</td><td>Merkle proof, one per address</td></tr>
      <tr><td>mintWithSignature(eventId, sig)</td><td>bearer of a signature</td><td><b>37 days</b></td><td>creator-signed, one per address</td></tr>
      <tr><td>creatorMint(eventId, list)</td><td>creator</td><td><b>30 days</b></td><td>≤101 recipients/tx, skips claimed</td></tr>
      <tr><td>updateAllowlistRoot(eventId, root)</td><td>creator</td><td><b>30 days</b>, once</td><td>root can never be changed after</td></tr>
      <tr><td>updateEventPublic(eventId, bool)</td><td>creator</td><td><b>30 days</b></td><td>open/close public minting</td></tr>
    </table>
    <div class="banner warn">All creator controls (batch mint, allowlist root, public toggle) hard-stop <b>30 days after registration</b>. Signature mints keep working until day <b>37</b>. After that the POAP is frozen in its final state — plan your distribution before registering if you need a long allowlist phase.</div>
  </div>
  <div class="card">
    <h2 style="margin-top:0">Creating a POAP</h2>
    <ol class="steps">
      <li>Open <a href="#/create">Create</a>, fill name (≤128 chars), optional description (≤512), date, location (≤128) and external URL (≤128).</li>
      <li>Provide SVG artwork. Paste it or upload a file. Hit <b>Optimize</b> — the built-in minifier strips comments, editor metadata (Inkscape/Sketch tags), ids and extra whitespace, and rounds long decimals. For serious size wins run <a href="https://svgo.dev" target="_blank" rel="noopener">SVGO</a> first, then paste.</li>
      <li>Pick distribution: <b>Public</b> (anyone mints), <b>Soulbound</b> (non-transferable), <b>Allowlist</b> (set a Merkle root now or later — within 30 days).</li>
      <li>Register. Your wallet asks for one transaction; artwork size drives the gas (the UI estimates it live). You are redirected to the new POAP's page.</li>
    </ol>
  </div>
  <div class="card">
    <h2 style="margin-top:0">POAP metadata</h2>
    <pre class="code">uri(eventId) → "data:application/json;base64,…"
{
  "name": "Demo Day",
  "description": "…",
  "image": "data:image/svg+xml;base64,…",   // the artwork itself
  "attributes": [
    {"trait_type":"Event","value":"Demo Day"},
    {"trait_type":"Location","value":"Berlin"},
    {"trait_type":"Date","display_type":"date","value":"1787123456"},
    {"trait_type":"EventId","value":"7"},
    {"trait_type":"Multichain EventId","value":"eip155:84532:0xC324…:7"},
    {"trait_type":"Creator","value":"0x…"},
    {"trait_type":"Soulbound","value":"true"}
  ],
  "external_url": "…"
}</pre>
    <p class="sub" style="font-size:13.5px">Because everything is a data-URI, marketplaces like OpenSea render the POAP with zero off-chain infrastructure.</p>
  </div>
  <div class="card">
    <h2 style="margin-top:0">SVG requirements & optimization</h2>
    <ul style="margin:8px 0 0 18px;color:var(--tx2);font-size:14px;line-height:1.8">
      <li>Must be a standalone <span class="mono">&lt;svg&gt;</span> document; it is stored verbatim (after base64).</li>
      <li>Keep it small: every byte costs gas at registration. Target <b>&lt; 10 KB</b>; the UI shows a live gas estimate.</li>
      <li>Avoid embedded rasters (base64 images inside SVG defeat the purpose), avoid huge path precision, drop editor namespaces.</li>
      <li>The built-in <b>Optimize</b> button handles the common 60–80%: comments, metadata, ids, whitespace, decimal rounding. SVGO does deeper tree-shaking if you need it.</li>
    </ul>
  </div>
  <div class="card">
    <h2 style="margin-top:0">Soulbound POAPs</h2>
    <p>Soulbound tokens can never move between addresses — mints and burns are the only transfers. Use them for attendance that should stay with the attendee (talks, volunteering, graduation). Transferable POAPs behave like regular ERC-1155 collectibles and can be traded on marketplaces.</p>
  </div>
  <div class="card">
    <h2 style="margin-top:0">Public minting</h2>
    <p>While a POAP is public, anyone can mint one copy per address. Creators can open/close it during the first 30 days — useful for "mint at the venue" phases. The event page always shows the live status and the time left in the creator window.</p>
  </div>
  <div class="card">
    <h2 style="margin-top:0">Allowlists (Merkle)</h2>
    <p>An allowlist gates minting to specific addresses using a <b>Merkle tree</b>: leaves are <span class="mono">keccak256(address)</span>, parent nodes are keccak of the sorted pair (OpenZeppelin <span class="mono">MerkleProof</span> semantics). Only the 32-byte root goes onchain.</p>
    <ol class="steps">
      <li>In the <b>creator console</b>, paste attendee addresses → <b>Build tree</b> → <b>Set root onchain</b> (one transaction, once ever).</li>
      <li><b>Download proofs JSON</b> — a file with every address and its proof. Distribute it anywhere (group chat, AirDrop, QR).</li>
      <li>Attendees open the POAP page, paste the file (or just the raw list) — the app rebuilds the tree locally, finds <i>their</i> proof, checks it against the onchain root and mints.</li>
    </ol>
    <p class="sub" style="font-size:13.5px">Attendees never need to understand Merkle proofs — the file is enough. Power users can paste a single proof array instead.</p>
  </div>
  <div class="card">
    <h2 style="margin-top:0">Signature minting & QR distribution</h2>
    <p>The creator signs <span class="mono">keccak256(packed(eventId, chainId, recipient))</span> with <span class="mono">personal_sign</span> — a free, gasless wallet prompt. The bearer of that signature can mint <b>once</b>, for that exact recipient address, until <b>37 days</b> after registration.</p>
    <ol class="steps">
      <li>Creator console → <b>Signature studio</b> → paste recipient addresses → <b>Sign all</b>.</li>
      <li>Each signature becomes a mint link: <span class="mono">…/#/event/7?sig=0x…</span> — opening it pre-fills the mint form.</li>
      <li><b>QR sheet</b> renders every link as a printable QR code grid — put it on a screen, poster or badge at your event. Attendees scan with their phone wallet browser and mint on the spot.</li>
      <li>Distribute links individually for remote audiences (each signature is address-bound, so leaking one only risks that one slot).</li>
    </ol>
    <div class="banner">Signatures are only valid for the exact address they were created for, and each address can only ever claim the POAP once — a stolen signature is worthless to anyone else.</div>
  </div>
  <div class="card">
    <h2 style="margin-top:0">Creator permissions & deadlines</h2>
    <ul style="margin:8px 0 0 18px;color:var(--tx2);font-size:14px;line-height:1.8">
      <li>Only the registering address is the creator; there is no transfer of creator rights.</li>
      <li>Batch mint, allowlist root and public toggle: <b>30 days</b> from registration.</li>
      <li>Signature mints: <b>37 days</b> from registration (30 + 7 grace).</li>
      <li>The allowlist root can be set <b>exactly once</b>. Generate and test your list before committing.</li>
      <li>Soulbound flags are permanent — choose before registering.</li>
    </ul>
  </div>
  <div class="card">
    <h2 style="margin-top:0">Verifying minted POAPs</h2>
    <p>Every POAP page links to BaseScan (token tracker + your transaction) and OpenSea. The built-in <a href="#/verify">Verify</a> tool re-reads the full metadata from the chain and shows creator, dates, soulbound status and your claim state — a pure <span class="mono">eth_call</span> audit, no indexer.</p>
  </div>
  <div class="card">
    <h2 style="margin-top:0">For developers</h2>
    <p>This whole app is a single HTML file with <b>zero dependencies</b>: hand-rolled keccak-256, ABI encoder/decoder, Merkle builder, QR encoder and SVG minifier — all speaking to the contract through the injected wallet provider (<span class="mono">eth_call</span> for reads, <span class="mono">eth_sendTransaction</span> for writes). It also runs as a <b>Farcaster Mini App</b> (manifest at <span class="mono">/.well-known/farcaster.json</span>). Clone it, point <span class="mono">CONTRACT_DEFAULT</span> at any deployment of the same contract, and go.</p>
  </div>`;
}

/* ---------- boot ---------- */
(async function boot(){
  renderChrome();
  try{
    if(window.ethereum){
      const acc=await window.ethereum.request({method:'eth_accounts'});
      if(acc&&acc[0]){state.account=acc[0];state.chainId=await window.ethereum.request({method:'eth_chainId'});renderChrome()}
      window.ethereum.on&&window.ethereum.on('accountsChanged',a=>{state.account=a[0]||null;state.cache={};renderChrome();route()});
      window.ethereum.on&&window.ethereum.on('chainChanged',c=>{state.chainId=c;state.cache={};renderChrome();route()});
    }
  }catch(e){}
  route();
})();
